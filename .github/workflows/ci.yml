# CI (docs/sdlc-plan.md, Stage 5): the same loop as a local `verify`, plus a guard on applied migrations.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Closes the hooks' Bash-edit gap: an applied Flyway migration must never change (CLAUDE.md, "Migrations").
  # Adding a new V<n>__*.sql (A) is fine; modifying (M), deleting (D) or renaming (R) one is not.
  migration-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the three-dot diff needs the merge base with the target branch
      - name: Fail on modified, deleted or renamed migrations
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changes="$(git diff --name-status -M "origin/$BASE_REF...HEAD" -- src/main/resources/db/migration)"
          echo "${changes:-no migration changes}"
          bad="$(awk '$1 ~ /^[MDR]/' <<<"$changes")"
          if [[ -n "$bad" ]]; then
            while read -r status path _; do
              echo "::error file=$path::$status on an applied Flyway migration; add a new V<n>__*.sql instead"
            done <<<"$bad"
            exit 1
          fi

  # verify.sh: ./gradlew test --rerun check (JaCoCo gate), a compose stack, the contract check, teardown.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify
        run: .claude/skills/verify/verify.sh
      - name: Upload JaCoCo report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html/
      # verify.sh writes each step's output to a log, not the console; a red run needs these to read.
      - name: Upload verify logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: verify-logs
          path: build/verify/
