spring:
  application:
    name: banking
  datasource:
    url: jdbc:postgresql://localhost:5432/banking
    username: banking
    password: banking
  rabbitmq:
    host: localhost
    port: 5672
    username: banking   # compose's own user: guest only works from loopback
    password: banking
    publisher-confirm-type: correlated   # ADR-0003
    connection-timeout: 5s     # don't hang the outbox poller, and its open DB transaction, on a dead broker
    channel-rpc-timeout: 5s    # default 10 min: a channel.open against a paused broker would block that long

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    rabbit:
      enabled: false   # the app serves without the broker by design (ADR-0003), so health is app + DB

banking:
  outbox:   # ADR-0003
    poll-interval: 200ms
    batch-size: 100
    confirm-timeout: 2s   # per batch; unconfirmed rows stay pending and are retried

mybatis:
  type-handlers-package: com.danielrak.banking.persistence
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true   # map rows into records by constructor argument name
    local-cache-scope: statement   # no session cache: an UPDATE … RETURNING @Select always runs
